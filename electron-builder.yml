# yarn app:pack → build/release/Koma.app (+ .dmg). Unsigned.
appId: com.baku89.koma
productName: Koma
copyright: Baku Hashimoto (GPL-3.0)
directories:
  output: build/release
files:
  - build/electron/**
  - build/renderer/**
  - package.json
# Runtime dependencies of the main process (package.json "dependencies"): osc-js,
# ws, zod and the MCP SDK for the bundled aux (electron/aux.ts); nothing native.
npmRebuild: false
asar: true
mac:
  category: public.app-category.photography
  # Icon Composer asset: actool (Xcode 26+) compiles it to Assets.car + icon.icns.
  icon: electron/Koma.icon
  identity: null
  target:
    - dir
    - dmg
  extendInfo:
    NSCameraUsageDescription: Koma uses webcams as a camera source.
    NSMicrophoneUsageDescription: Koma can record reference audio.
